name: Android — Firebase Testers Granada

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas de la versión (qué hay de nuevo)'
        required: false
        default: ''

jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Android keystore
        run: |
          echo "${{ secrets.CM_KEYSTORE }}" | base64 --decode > $RUNNER_TEMP/keystore.jks
          cat >> android/key.properties <<EOF
          storePassword=${{ secrets.CM_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.CM_KEY_PASSWORD }}
          keyAlias=${{ secrets.CM_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:1085482191658:android:e514126ea27731a3d62c53
          token: ${{ secrets.FIREBASE_TOKEN }}
          testers: editorialnazari@gmail.com,eventos@editorialnazari.com,editorialacentuarte@gmail.com
          releaseNotes: |
            ─── NOVEDADES EN FLUIX v1.0.20 ─────────────
            • Portal del empleado: consulta turnos, fichajes y mensajes desde el móvil
            • Módulo de fichajes rediseñado con entrada/salida y control de jornada
            • Pedidos conectados a facturación (generación directa desde el pedido)
            • Logo Nazarí en documentos PDF
            • Mejoras de estabilidad y rendimiento

            ─── CÓMO INSTALAR EN ANDROID ─────────────
            1. Abre este correo desde el móvil y pulsa el botón "Download"
            2. Si es la primera vez, te pedirá instalar "Firebase App Tester" — acéptalo
            3. Dentro de Firebase App Tester pulsa "Download" de nuevo sobre Fluix
            4. Si el móvil pregunta por "instalar apps de fuentes desconocidas", acepta
            5. Abre Fluix e inicia sesión con tu usuario habitual

            Si ya tenías una versión anterior instalada, se actualizará automáticamente.
          file: build/app/outputs/flutter-apk/app-release.apk

name: Android — Build Check

on:
  workflow_dispatch:
    inputs:
      version_notes:
        description: 'Versión o notas (opcional, solo para referencia)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clear Gradle caches
        run: rm -rf ~/.gradle/caches ~/.gradle/wrapper/dists

      - name: Set up Android keystore
        run: |
          echo "${{ secrets.CM_KEYSTORE }}" | base64 --decode > $RUNNER_TEMP/keystore.jks
          cat >> android/key.properties <<EOF
          storePassword=${{ secrets.CM_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.CM_KEY_PASSWORD }}
          keyAlias=${{ secrets.CM_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluix-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

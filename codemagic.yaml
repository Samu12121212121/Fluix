# ═══════════════════════════════════════════════════════════════════════════════
# Codemagic CI/CD — Compilar Fluix CRM para iOS y Android
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
# ═══════════════════════════════════════════════════════════════════════════════

workflows:
  # ─── iOS — App Store ──────────────────────────────────────────────────────
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Fluix tech sl
    environment:
      flutter: 3.41.3
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fluixtech.crm
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.fluixtech.crm \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Nazarí Testers

  # ─── Android — Firebase App Distribution (Testers) ───────────────────────
  android-firebase-distribution:
    name: Android — Firebase Testers Granada
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: 3.41.3
      groups:
        - keystore_credentials   # CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
        - firebase_credentials   # FIREBASE_TOKEN (obtener con: firebase login:ci)
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Set up Android keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/keystore.jks
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/keystore.jks
          EOF
      - name: Build release APK
        script: |
          flutter build apk --release
      - name: Distribuir via Firebase App Distribution
        script: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app 1:1085482191658:android:c2de28caf383e9e4d62c53 \
            --testers "editorialnazari@gmail.com,Eventos@editorialnazari.com,Editorialacentuarte@gmail.com,Aliorte.lope@gmail.com" \
            --release-notes "Versión de prueba para testers de Granada" \
            --token "$FIREBASE_TOKEN"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  # ─── Android — Play Store ─────────────────────────────────────────────────
  android-release:
    name: Android Play Store Release
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: 3.41.3
      groups:
        - google_play_credentials  # Configura en Codemagic UI
        - keystore_credentials     # Configura en Codemagic UI
        - google_play_credentials
        - keystore_credentials
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal  # internal → alpha → beta → production





